[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
no_match_path = "test/fork/*"
fuzz = { runs = 512 }

# Against Sepolia: forge test --profile fork (needs an RPC that serves historical state)
[profile.fork]
match_path = "test/fork/*"
no_match_path = ""
eth_rpc_url = "https://ethereum-sepolia-rpc.publicnode.com"
